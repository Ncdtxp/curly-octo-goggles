<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tap Sim Reborn — Casino Lounge</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { padding: 10px; margin: 10px 0; width: 90%; border-radius: 5px; border: none; }
        input { background: #2c2c2c; color: white; }
        button { background: #c8a15a; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background: #e0b465; }
        .red { background: #e24b4b !important; color: white !important; }
        .blue { background: #3d7ddc !important; color: white !important; }
        .msg { color: #3ddc97; font-weight: bold; }
        .error { color: #e24b4b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎰 TAP SIM REBORN — WEB LOUNGE 🎰</h1>
    
    {% if not username %}
    <div class="card">
        <h3>Giriş Yap</h3>
        <form method="POST">
            <input type="hidden" name="action" value="login">
            <input type="text" name="username" placeholder="Kullanıcı adınızı girin..." required>
            <button type="submit">Oyuna Gir</button>
        </form>
    </div>
    {% else %}
    <div class="card">
        <p>Hoş geldin, <b>{{ username }}</b>!</p>
        <p>💳 Cüzdan: <b>{{ tokens }} Tokens</b></p>
        <p>📊 Toplam Wager: <b>{{ wagered }} Tokens</b></p>
        
        <hr style="border: 0.5px solid #333;">
        
        <h3>🪙 Coinflip Oyunu</h3>
        <form method="POST">
            <input type="hidden" name="action" value="coinflip">
            <input type="number" name="amount" placeholder="Bahis Miktarı" min="1" required>
            <button type="submit" name="side" value="RED" class="red">Kırmızıya Oyna (RED)</button>
            <button type="submit" name="side" value="BLUE" class="blue">Maviye Oyna (BLUE)</button>
        </form>

        {% if message %}<p class="msg">{{ message }}</p>{% endif %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </div>
    {% endif %}
</body>
</html>
